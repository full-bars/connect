name: urnet-tools release assets

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and upload urnet-tools binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Build tools
        working-directory: cmd/urnet-tools
        run: |
          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then EXT=".exe"; fi
          mkdir -p "build/${{ matrix.os }}/${{ matrix.arch }}"
          env CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            go build -o "build/${{ matrix.os }}/${{ matrix.arch }}/urnet-tools${EXT}" .
          env CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            go build -o "build/${{ matrix.os }}/${{ matrix.arch }}/urnetwork-updater${EXT}" ../urnetwork-updater

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: cmd/urnet-tools
        run: |
          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then EXT=".exe"; fi
          gh release upload "${{ github.event.release.tag_name }}" \
            "build/${{ matrix.os }}/${{ matrix.arch }}/urnet-tools${EXT}#urnet-tools-${{ matrix.os }}-${{ matrix.arch }}${EXT}" \
            "build/${{ matrix.os }}/${{ matrix.arch }}/urnetwork-updater${EXT}#urnetwork-updater-${{ matrix.os }}-${{ matrix.arch }}${EXT}" \
            --clobber
